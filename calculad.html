<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculadora de Pago Water Guru</title>

<style>

*{
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f7fa;
    margin:0;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    color:#0099cc;
    margin-bottom:10px;
}

.sub{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:20px;
    margin-bottom:8px;
    font-weight:bold;
}

select,
input[type=number]{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

input[type=range]{
    width:100%;
}

.resultado{
    margin-top:25px;
    background:#eef8fc;
    padding:20px;
    border-radius:15px;
}

.linea{
    display:flex;
    justify-content:space-between;
    margin:10px 0;
}

.pago{
    text-align:center;
    margin-top:20px;
}

.pago h2{
    font-size:42px;
    color:#0099cc;
    margin:0;
}

.pago p{
    margin:5px;
    color:#666;
}

.btn{
    width:100%;
    margin-top:25px;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#0099cc;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.btn:hover{
    opacity:.9;
}

.valor-slider{
    text-align:right;
    font-weight:bold;
    color:#0099cc;
}

@media(max-width:600px){

    h1{
        font-size:24px;
    }

    .pago h2{
        font-size:36px;
    }

}

</style>
</head>

<body>

<div class="container">

<h1>💧 Calcula tu Pago</h1>

<div class="sub">
Descubre cuánto podrías pagar al mes
</div>

<label>Producto</label>

<select id="producto">
    <option value="1495">Purificador RO Xpert Water - $1495</option>
    <option value="1795">Purificador RO Alkalino - $1795.00</option>
    <option value="2400">Filtro Casa Completa( PUNTO DE USO) - $2,400</option>
    <option value="3937">Filtro Casa Completa Premium  - $3937</option>
</select>

<label>Pronto Pago</label>

<input type="range"
       id="pronto"
       min="0"
       max="3000"
       value="0"
       step="50">

<div class="valor-slider" id="prontoValor">
$0
</div>

<label>Meses</label>

<input type="range"
       id="meses"
       min="4"
       max="36"
       value="24">

<div class="valor-slider" id="mesesValor">
24 meses
</div>

<div class="resultado">

<div class="linea">
<span>Precio:</span>
<span id="precio">$1495</span>
</div>

<div class="linea">
<span>Pronto:</span>
<span id="prontoDisplay">-$0</span>
</div>

<div class="linea">
<span>Monto financiado:</span>
<span id="financiado">$1495</span>
</div>

<div class="pago">

<p>Pago estimado</p>

<h2 id="mensual">$20.63</h2>

<p id="diario">
≈ $0.69 por día
</p>

</div>

</div>

<button class="btn" onclick="window.open('https://wa.me/17879729553','_blank')">
SOLICITAR INFORMACIÓN
</button>

</div>

<script>

const producto =
document.getElementById("producto");

const pronto =
document.getElementById("pronto");

const meses =
document.getElementById("meses");

function actualizar(){

    let precio =
    parseFloat(producto.value);

    let prontoPago =
    parseFloat(pronto.value);

    let plazo =
    parseFloat(meses.value);

    if(prontoPago > precio){
        prontoPago = precio;
    }

    let financiado =
    precio - prontoPago;

    let mensual =
    financiado / plazo;

    let diario =
    mensual / 30;

    document.getElementById("precio")
    .innerHTML =
    "$" + precio.toLocaleString();

    document.getElementById("prontoDisplay")
    .innerHTML =
    "-$" + prontoPago.toLocaleString();

    document.getElementById("financiado")
    .innerHTML =
    "$" + financiado.toLocaleString();

    document.getElementById("mensual")
    .innerHTML =
    "$" + mensual.toFixed(2);

    document.getElementById("diario")
    .innerHTML =
    "≈ $" + diario.toFixed(2) + " por día";

    document.getElementById("prontoValor")
    .innerHTML =
    "$" + prontoPago.toLocaleString();

    document.getElementById("mesesValor")
    .innerHTML =
    plazo + " meses";
}

producto.addEventListener("change",actualizar);
pronto.addEventListener("input",actualizar);
meses.addEventListener("input",actualizar);

actualizar();

</script>

</body>
</html>
